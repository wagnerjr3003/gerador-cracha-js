<body>

  <h1>prompt let nome</h1>

  <script>

   let nome = prompt("Digite seu nome:");
        let sobrenome = prompt("Digite seu sobrenome:");
        let anoNascimento = prompt("Digite o ano em que você nasceu:");
        let ativo = confirm("É aluno ativo da instituição?");

        alert(
            "Nome: " + nome + " " + sobrenome +
            "\nAno de nascimento: " + anoNascimento +
            "\nEstá ativo na instituição: " + ativo
        );
     anoNascimento = Number(anoNascimento);
    let anoAtual = new Date().getFullYear();
        let idade = anoAtual - anoNascimento;
        let sobrenomeMaiusculo = sobrenome.toUpperCase();
        let quantidadeLetras = nome.length;
        console.log("CRACHÁ VIRTUAL: " + sobrenomeMaiusculo + ", " + nome);
        console.log("Idade estimada: " + idade + " anos.");
        console.log("O seu primeiro nome tem " + quantidadeLetras + " letras.");
        console.log("Estatuto de aluno ativo: " + ativo);

  </script>
